/* =====================================================
   ЗАГРУЗКА ОТЗЫВОВ ИЗ FIREBASE
===================================================== */
let reviewsLoaded = false;

function loadReviewsFromFirebase() {
  reviewsRef.on('value', snapshot => {
    const data = snapshot.val() || {};
    reviews = Object.keys(data).map(key => ({
      key,
      ...data[key]
    }));
    reviews.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    reviewsLoaded = true;

    // Скрываем индикатор загрузки
    const loading = $('loading');
    if (loading) loading.style.display = 'none';
    $('mainView').style.display = 'block';

    // Перерисовываем текущий экран
    if (currentTeacherId) {
      renderAverage();
      renderReviews();
    } else if (currentDeptId) {
      renderTeachersList();
    } else {
      renderInstitutesList();
    }
  }, err => {
    console.error('Ошибка загрузки отзывов:', err);
    showToast('Не удалось загрузить отзывы');
    const loading = $('loading');
    if (loading) loading.style.display = 'none';
    $('mainView').style.display = 'block';
    renderInstitutesList();
  });
}

function renderBreadcrumbs() {
  const bc = $('breadcrumbs');
  const inst = INSTITUTES.find(i => i.id === currentInstituteId);
  const dept = inst ? inst.departments.find(d => d.id === currentDeptId) : null;

  let html = '';
  if (!inst) {
    html = '<span>🏛️ Институты и кафедры МГСУ</span>';
  } else {
    html += `<button onclick="showMain()">🏛️ Все институты</button>`;
    html += `<span>›</span><span>${escapeHtml(inst.short)}</span>`;
    if (dept) {
      html += `<span>›</span>`;
      if (currentTeacherId) {
        const short = dept.name.length > 28 ? dept.name.substring(0, 28) + '…' : dept.name;
        html += `<button onclick="showTeachers('${inst.id}','${dept.id}')">${escapeHtml(short)}</button>`;
      } else {
        const short = dept.name.length > 40 ? dept.name.substring(0, 40) + '…' : dept.name;
        html += `<span>${escapeHtml(short)}</span>`;
      }
    }
  }
  bc.innerHTML = html;
}

function renderInstitutesList() {
  const container = $('institutesList');
  if (!container) return;
  container.innerHTML = INSTITUTES.map(inst => {
    const totalDeptReviews = reviews.filter(r => r.instituteId === inst.id).length;
    const totalTeachers = inst.departments.reduce((s, d) => s + (d.teachers?.length || 0), 0);
    const deptsHtml = inst.departments.map(d => {
      const dReviews = reviews.filter(r => r.deptId === d.id).length;
      return `
        <li onclick="showTeachers('${inst.id}','${d.id}')">
          <span class="dept-name">${escapeHtml(d.name)}</span>
          <span class="dept-info">
            <span class="badge ${dReviews === 0 ? 'empty' : ''}">${dReviews}</span>
            <span class="mini-arrow">›</span>
          </span>
        </li>
      `;
    }).join('');

    const metaParts = [`${inst.departments.length} кафедр`];
    if (totalTeachers) metaParts.push(`${totalTeachers} препод.`);
    if (totalDeptReviews) metaParts.push(`${totalDeptReviews} отз.`);

    return `
      <div class="institute-block">
        <div class="institute-header">
          <span class="name">${escapeHtml(inst.name)}</span>
          <span class="count">${metaParts.join(' · ')}</span>
        </div>
        <ul class="dept-list">${deptsHtml}</ul>
      </div>
    `;
  }).join('');
}

  return reviews.filter(r => r.teacherId === currentTeacherId);

function renderAverage() {
  const list = currentTeacherReviews();
  if (list.length === 0) {
    $('avgScore').textContent = '0.0';
    $('avgStars').textContent = '☆☆☆☆☆';
    $('avgCount').textContent = 'Пока нет оценок';
    return;
  }
  const avg = list.reduce((s, r) => s + r.rating, 0) / list.length;
  $('avgScore').textContent = avg.toFixed(1);
  $('avgStars').textContent = '★'.repeat(Math.round(avg)) + '☆'.repeat(5 - Math.round(avg));
  $('avgCount').textContent = `${list.length} ${plural(list.length, 'отзыв', 'отзыва', 'отзывов')}`;
}

  const list = currentTeacherReviews();
  const container = $('reviewsList');
  const count = $('reviewCount');
  count.textContent = list.length ? `${list.length} ${plural(list.length, 'отзыв', 'отзыва', 'отзывов')}` : '';

  if (list.length === 0) {
    container.innerHTML = '<p class="empty">Отзывов пока нет. Будьте первым! ✨</p>';
    return;
  }

    <div class="review">

        <span class="review-name">${escapeHtml(r.name)}</span>
        <span class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>

        </div>` : ''}

    </div>
  `).join('');

  container.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', () => deleteReview(btn.dataset.key));
  });
}

===================================================== */
$('photoUpload').addEventListener('click', () => $('photoInput').click());
$('photoInput').addEventListener('change', async e => {
  const files = Array.from(e.target.files).slice(0, 5 - currentPhotos.length);
  for (const file of files) {
    if (file.size > 1.5 * 1024 * 1024) { showToast('Файл больше 1.5 МБ пропущен'); continue; }
    try {
      const compressed = await compressImage(file);
      currentPhotos.push(compressed);
    } catch (err) { showToast('Не удалось загрузить фото'); }
  }
  $('photoInput').value = '';
  renderPreviews();
});

/* Сжатие фото перед отправкой (важно для Firebase) */
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX = 800;
        let { width, height } = img;
        if (width > height && width > MAX) { height *= MAX / width; width = MAX; }
        else if (height > MAX) { width *= MAX / height; height = MAX; }
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderPreviews() {
  const grid = $('previewGrid');
  grid.innerHTML = currentPhotos.map((src, i) => `
    <div class="preview-item">
      <img src="${src}" alt="">
      <button class="remove" data-i="${i}" type="button">×</button>
    </div>
  `).join('');
  grid.querySelectorAll('.remove').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      currentPhotos.splice(Number(btn.dataset.i), 1);
      renderPreviews();
    });
  });
}

function openLightbox(reviewKey, photoIndex) {
  const review = reviews.find(r => r.key === reviewKey);
  if (!review || !review.photos || !review.photos[photoIndex]) return;
  $('lightboxImg').src = review.photos[photoIndex];
  $('lightbox').classList.add('show');
}

$('lightbox').addEventListener('click', () => $('lightbox').classList.remove('show'));

const starInput = $('starInput');
const starSpans = starInput.querySelectorAll('span');
function highlightStars(value) {
  starSpans.forEach(s => s.classList.toggle('active', Number(s.dataset.value) <= value));
}
starSpans.forEach(star => {
  star.addEventListener('mouseenter', () => highlightStars(Number(star.dataset.value)));
  star.addEventListener('click', () => {
    selectedRating = Number(star.dataset.value);
    highlightStars(selectedRating);
  });
});
starInput.addEventListener('mouseleave', () => highlightStars(selectedRating));

  if (selectedRating === 0) return showToast('Поставьте оценку ⭐');
  if (!name)                return showToast('Введите имя');
  if (!text)                return showToast('Напишите комментарий');

  const btn = $('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Отправка...';

  const newReview = {
    instituteId: currentInstituteId,
    deptId: currentDeptId,
    teacherId: currentTeacherId,
    name, text,
    rating: selectedRating,
    photos: [...currentPhotos],
    date: new Date().toISOString()
  };

  reviewsRef.push(newReview)
    .then(() => {
      selectedRating = 0;
      currentPhotos = [];
      highlightStars(0);
      $('name').value = '';
      $('text').value = '';
      $('previewGrid').innerHTML = '';
      showToast('Спасибо за отзыв! 🎉');
    })
    .catch(err => {
      console.error('Ошибка отправки:', err);
      showToast('Ошибка отправки — попробуйте ещё');
    })
    .finally(() => {
      btn.disabled = false;
      btn.textContent = 'Отправить отзыв';
    });
});

/* =====================================================
   УДАЛЕНИЕ ИЗ FIREBASE
===================================================== */
function deleteReview(key) {
  if (!confirm('Удалить этот отзыв?')) return;
  reviewsRef.child(key).remove()
    .then(() => showToast('Отзыв удалён'))
    .catch(err => {
      console.error('Ошибка удаления:', err);
      showToast('Не удалось удалить');
    });
}

/* =====================================================
   УТИЛИТЫ
===================================================== */
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

function formatDate(iso) {
  return new Date(iso).toLocaleString('ru-RU', {
    day: 'numeric', month: 'short', year: 'numeric',
    hour: '2-digit', minute: '2-digit'
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = String(str ?? '');
  return div.innerHTML;
}

let toastTimer;
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
 /* =====================================================
   РЕЙТИНГ
===================================================== */
function showRating() {
  currentInstituteId = null;
  currentDeptId = null;
  currentTeacherId = null;

  $('mainView').style.display = 'none';
  $('teachersView').style.display = 'none';
  $('teacherPage').style.display = 'none';
  $('ratingView').style.display = 'block';
  searchResults.style.display = 'none';

  // Подсветим активную кнопку
  $('navHome').classList.remove('active');
  $('navRating').classList.add('active');

  // Заполним список институтов в фильтре
  const sel = $('ratingInstitute');
  if (sel.options.length <= 1) {
    INSTITUTES.forEach(inst => {
      const opt = document.createElement('option');
      opt.value = inst.id;
      opt.textContent = inst.short;
      sel.appendChild(opt);
    });
  }

  function renderBreadcrumbs() {
  const bc = $('breadcrumbs');
  const inst = INSTITUTES.find(i => i.id === currentInstituteId);
  const dept = inst ? inst.departments.find(d => d.id === currentDeptId) : null;

  let html = '';
  if ($('ratingView')?.style.display === 'block') {
    html = '<span>🏆 Рейтинг преподавателей</span>';
  } else if (!inst) {
    html = '<span>🏛️ Институты и кафедры МГСУ</span>';
  } else {
    html += `<button onclick="showMain()">🏛️ Все институты</button>`;
    html += `<span>›</span><span>${escapeHtml(inst.short)}</span>`;
    if (dept) {
      html += `<span>›</span>`;
      if (currentTeacherId) {
        const short = dept.name.length > 28 ? dept.name.substring(0, 28) + '…' : dept.name;
        html += `<button onclick="showTeachers('${inst.id}','${dept.id}')">${escapeHtml(short)}</button>`;
      } else {
        const short = dept.name.length > 40 ? dept.name.substring(0, 40) + '…' : dept.name;
        html += `<span>${escapeHtml(short)}</span>`;
      }
    }
  }
  bc.innerHTML = html;
}
  renderRating();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderRating() {
  const container = $('ratingList');
  if (!container) return;

  // Пересчитаем средние для всех преподавателей
  const all = [];
  INSTITUTES.forEach(inst => {
    inst.departments.forEach(dept => {
      (dept.teachers || []).forEach(t => {
        const tReviews = reviews.filter(r => r.teacherId === t.id);
        if (tReviews.length > 0) {
          const avg = tReviews.reduce((s, r) => s + r.rating, 0) / tReviews.length;
          all.push({
            inst, dept, teacher: t,
            avg,
            count: tReviews.length
          });
        }
      });
    });
  });

  // Фильтр по институту
  const filterInst = $('ratingInstitute')?.value || '';
  let filtered = filterInst ? all.filter(x => x.inst.id === filterInst) : all;

  // Сортировка
  const sortBy = $('ratingSort')?.value || 'rating';
  if (sortBy === 'rating') {
    filtered.sort((a, b) => b.avg - a.avg || b.count - a.count);
  } else {
    filtered.sort((a, b) => b.count - a.count || b.avg - a.avg);
  }

  // Показываем только с минимум 2 отзывами (иначе рейтинг не показателен)
  const top = filtered.filter(x => x.count >= 2).slice(0, 100);

  if (top.length === 0) {
    container.innerHTML = `
      <div class="rating-empty">
        <div style="font-size: 40px; margin-bottom: 10px;">📊</div>
        <div style="margin-bottom: 8px;">Пока нет данных для рейтинга</div>
        <div style="font-size: 13px; opacity: 0.7;">
          Нужно минимум 2 отзыва для каждого преподавателя.<br>
          Оставьте отзывы — и рейтинг появится!
        </div>
      </div>
    `;
    return;
  }

  container.innerHTML = top.map((item, i) => {
    const rank = i + 1;
    let medal = '';
    let rankClass = '';
    if (rank === 1) { medal = '🥇'; rankClass = 'top1'; }
    else if (rank === 2) { medal = '🥈'; rankClass = 'top2'; }
    else if (rank === 3) { medal = '🥉'; rankClass = 'top3'; }
    else { medal = `#${rank}`; }

    return `
      <div class="rating-item" onclick="openFromSearch('${item.inst.id}','${item.dept.id}','${item.teacher.id}')">
        <div class="rating-rank ${rankClass}">${medal}</div>
        <div class="rating-info">
          <div class="r-name">${escapeHtml(item.teacher.name)}</div>
          <div class="r-path">
            <b>${escapeHtml(item.inst.short)}</b> · ${escapeHtml(item.dept.name)}
          </div>
        </div>
        <div class="rating-score">
          <div class="r-avg">${item.avg.toFixed(1)}</div>
          <div class="r-count">${item.count} ${plural(item.count, 'отзыв', 'отзыва', 'отзывов')}</div>
        </div>
      </div>
    `;
  }).join('');
}

// Обработчики фильтров
if ($('ratingInstitute')) {
  $('ratingInstitute').addEventListener('change', renderRating);
}
if ($('ratingSort')) {
  $('ratingSort').addEventListener('change', renderRating);
}
/* =====================================================
   ПОИСК
===================================================== */
const searchInput = $('searchInput');
const searchClear = $('searchClear');
const searchResults = $('searchResults');

function normalizeStr(s) {
  return String(s || '').toLowerCase()
    .replace(/ё/g, 'е')
    .replace(/\s+/g, ' ')
    .trim();
}

function performSearch(query) {
  const q = normalizeStr(query);
  if (q.length < 2) {
    searchResults.style.display = 'none';
    return;
  }

  const results = [];
  INSTITUTES.forEach(inst => {
    inst.departments.forEach(dept => {
      (dept.teachers || []).forEach(t => {
        if (normalizeStr(t.name).includes(q) || normalizeStr(t.position).includes(q)) {
          results.push({ inst, dept, teacher: t });
        }
      });
    });
  });

  // Ограничим до 50 результатов
  const limited = results.slice(0, 50);

  if (limited.length === 0) {
    searchResults.innerHTML = '<div class="search-result sr-empty">Ничего не найдено 🔍</div>';
    searchResults.style.display = 'block';
    return;
  }

  searchResults.innerHTML = limited.map(r => {
    const tReviews = reviews.filter(x => x.teacherId === r.teacher.id);
    const avg = tReviews.length
      ? (tReviews.reduce((s, x) => s + x.rating, 0) / tReviews.length).toFixed(1)
      : null;

    // Подсветим совпадение
    const idx = normalizeStr(r.teacher.name).indexOf(q);
    let nameHtml;
    if (idx >= 0) {
      // найдём соответствующую позицию в оригинальной строке
      const lower = normalizeStr(r.teacher.name);
      // простой подход: найдём по первым буквам
      const origIdx = r.teacher.name.toLowerCase().replace(/ё/g, 'е').indexOf(q);
      if (origIdx >= 0) {
        nameHtml = escapeHtml(r.teacher.name.slice(0, origIdx)) +
          '<mark style="background:#ffeaa7; padding:0 2px; border-radius:3px;">' +
          escapeHtml(r.teacher.name.slice(origIdx, origIdx + query.length)) +
          '</mark>' +
          escapeHtml(r.teacher.name.slice(origIdx + query.length));
      } else {
        nameHtml = escapeHtml(r.teacher.name);
      }
    } else {
      nameHtml = escapeHtml(r.teacher.name);
    }

    return `
      <div class="search-result" onclick="openFromSearch('${r.inst.id}','${r.dept.id}','${r.teacher.id}')">
        <div class="sr-name">${nameHtml}</div>
        <div class="sr-path">
          <b>${escapeHtml(r.inst.short)}</b> · ${escapeHtml(r.dept.name)}
        </div>
        <div class="sr-meta">
          ${avg
            ? `<span class="stars">★</span><b style="color:#2a5298">${avg}</b> <span style="color:#b2bec3">(${tReviews.length})</span>`
            : `<span class="badge empty">нет оценок</span>`}
          ${r.teacher.position ? `<span style="color:#636e72">${escapeHtml(r.teacher.position)}</span>` : ''}
        </div>
      </div>
    `;
  }).join('');

  searchResults.style.display = 'block';
}

function openFromSearch(instId, deptId, teacherId) {
  // Скрываем результаты поиска
  searchResults.style.display = 'none';
  searchInput.value = '';
  searchClear.classList.remove('show');

  // Открываем страницу преподавателя
  showTeacherPage(instId, deptId, teacherId);
}

if (searchInput) {
  searchInput.addEventListener('input', e => {
    const val = e.target.value;
    searchClear.classList.toggle('show', val.length > 0);
    performSearch(val);
  });

  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      searchInput.value = '';
      searchClear.classList.remove('show');
      searchResults.style.display = 'none';
    }
  });

  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    searchClear.classList.remove('show');
    searchResults.style.display = 'none';
    searchInput.focus();
  });
}

   СТАРТ

renderInstitutesList();
loadReviewsFromFirebase();
